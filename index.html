<!doctype html>
<html lang="fr">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <meta name="theme-color" content="#111111" />
        <meta name="color-scheme" content="light dark" />
        <title>Clair de lune</title>

        <!-- Swiper (CDN) -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

        <link rel="icon" type="image/svg+xml" href="./icon.svg">
        
        <style>
            :root {
                --bg: #0f0f10;
                --panel: #17171a;
                --text: #f5f5f6;
                --muted: #a9a9b2;
                --grid: #2a2a30;
                --today: #2d8cff;

                --period: #ff6fae;
                --fertile: #ffd54a;
                --ovu: #ff8a3d;

                --shadow: 0 10px 30px rgba(0, 0, 0, .35);
                --radius: 16px;
                --cellRadius: 14px;
                --safeTop: env(safe-area-inset-top, 0px);
                --safeBottom: env(safe-area-inset-bottom, 0px);
                --safeLeft: env(safe-area-inset-left, 0px);
                --safeRight: env(safe-area-inset-right, 0px);
                --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif;
                --tap: rgba(255, 255, 255, .06);
            }

            @media (prefers-color-scheme: light) {
                :root {
                    --bg: #f6f6f8;
                    --panel: #ffffff;
                    --text: #141416;
                    --muted: #5e5e69;
                    --grid: #e8e8ee;
                    --shadow: 0 10px 30px rgba(0, 0, 0, .08);
                    --tap: rgba(0, 0, 0, .05);
                }
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
            }

            body {
                margin: 0;
                font-family: var(--font);
                background: var(--bg);
                color: var(--text);
                overscroll-behavior: none;
            }

            .app {
                height: 100%;
                padding: calc(14px + var(--safeTop)) calc(14px + var(--safeRight)) calc(14px + var(--safeBottom)) calc(14px + var(--safeLeft));
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            header {
                background: var(--panel);
                border: 1px solid var(--grid);
                border-radius: var(--radius);
                box-shadow: var(--shadow);
                padding: 14px;
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 10px;
                align-items: center;
            }

            .headline {
                display: flex;
                flex-direction: column;
                gap: 4px;
                min-width: 0;
            }

            .headline .title {
                font-size: 16px;
                font-weight: 700;
                line-height: 1.2;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .headline .sub {
                font-size: 13px;
                color: var(--muted);
                line-height: 1.2;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .legend {
                display: flex;
                gap: 10px;
                align-items: center;
                flex-wrap: wrap;
                color: var(--muted);
                font-size: 12px;
            }

            .dot {
                width: 10px;
                height: 10px;
                border-radius: 999px;
                display: inline-block;
                margin-right: 6px;
                transform: translateY(1px);
            }

            .dot.period {
                background: var(--period);
            }

            .dot.fertile {
                background: var(--fertile);
            }

            .dot.ovu {
                background: var(--ovu);
            }

            .dot.today {
                background: var(--today);
            }

            .actions {
                display: flex;
                gap: 10px;
                align-items: center;
            }

            button {
                appearance: none;
                border: 1px solid var(--grid);
                background: transparent;
                color: var(--text);
                padding: 10px 12px;
                border-radius: 12px;
                font-weight: 650;
                font-size: 13px;
                cursor: pointer;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
            }

            button:active {
                background: var(--tap);
            }

            .iconBtn {
                width: 38px;
                height: 38px;
                border-radius: 12px;
                display: grid;
                place-items: center;
                padding: 0;
            }

            .calendarShell {
                flex: 1;
                min-height: 0;
                background: var(--panel);
                border: 1px solid var(--grid);
                border-radius: var(--radius);
                box-shadow: var(--shadow);
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                overflow: hidden;
            }

            .monthRow {
                display: grid;
                grid-template-columns: auto 1fr auto;
                align-items: center;
                gap: 10px;
                padding: 2px 4px 0 4px;
            }

            .monthTitle {
                text-align: center;
                font-weight: 800;
                letter-spacing: .2px;
                font-size: 15px;
                user-select: none;
            }

            .dow {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                gap: 8px;
                padding: 0 4px;
                user-select: none;
                color: var(--muted);
                font-size: 12px;
                font-weight: 650;
            }

            .dow div {
                text-align: center;
                padding: 6px 0;
            }

            /* Swiper layout: ensure it has height so our calendar grid can use 6 equal rows */
            .swiper {
                flex: 1;
                min-height: 0;
                width: 100%;
                border-radius: 14px;
                overflow: hidden;
            }

            .swiper-wrapper {
                height: 100%;
            }

            .swiper-slide {
                height: 100%;
                width: 100%;
                padding: 0 4px 6px 4px;
            }

            /* Rename calendar grid class to avoid any potential CSS collisions */
            .calGrid {
                height: 100%;
                width: 100%;
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                grid-template-rows: repeat(6, 1fr);
                gap: 8px;
            }

            .cell {
                position: relative;
                border: 1px solid var(--grid);
                border-radius: var(--cellRadius);
                padding: 8px;
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 6px;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                overflow: hidden;
                pointer-events: none;
                opacity: 1;
            }

            .dayNum {
                font-weight: 800;
                font-size: 14px;
                line-height: 1;
            }

            .cell.outMonth .dayNum {
                color: color-mix(in oklab, var(--muted) 85%, var(--text) 15%);
            }

            .cell.outMonth {
                opacity: .65;
            }

            .cell.future {
                opacity: .5;
            }

            .cell.today {
                outline: 2px solid color-mix(in oklab, var(--today) 80%, transparent);
                outline-offset: -2px;
                opacity: 1;
            }

            .badges {
                display: flex;
                gap: 6px;
                align-items: center;
                margin-left: auto;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .badge {
                width: 10px;
                height: 10px;
                border-radius: 999px;
            }

            .badge.period {
                background: var(--period);
            }

            .badge.fertile {
                background: var(--fertile);
            }

            .badge.ovu {
                background: var(--ovu);
            }

            .cell.periodBg::before,
            .cell.fertileBg::before,
            .cell.ovuBg::before {
                content: "";
                position: absolute;
                inset: 0;
                opacity: .16;
                pointer-events: none;
            }

            .cell.periodBg::before {
                background: var(--period);
            }

            .cell.fertileBg::before {
                background: var(--fertile);
            }

            .cell.ovuBg::before {
                background: var(--ovu);
                opacity: .22;
            }

            .hint {
                color: var(--muted);
                font-size: 12px;
                padding: 0 4px 2px 4px;
            }

            dialog {
                border: none;
                padding: 0;
                border-radius: 18px;
                background: var(--panel);
                color: var(--text);
                box-shadow: var(--shadow);
                width: min(520px, calc(100vw - 24px));
            }

            dialog::backdrop {
                background: rgba(0, 0, 0, .55);
            }

            .modal {
                padding: 14px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .modal h2 {
                margin: 0;
                font-size: 16px;
                font-weight: 850;
            }

            .fields {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .field {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            label {
                font-size: 12px;
                color: var(--muted);
                font-weight: 650;
            }

            input[type="date"],
            input[type="number"] {
                width: 100%;
                border: 1px solid var(--grid);
                border-radius: 12px;
                background: transparent;
                color: var(--text);
                padding: 10px 12px;
                font-size: 14px;
                outline: none;
            }

            .modalActions {
                display: flex;
                gap: 10px;
                justify-content: flex-end;
                flex-wrap: wrap;
            }

            .danger {
                border-color: color-mix(in oklab, var(--period) 45%, var(--grid));
                color: color-mix(in oklab, var(--period) 85%, var(--text));
            }

            .primary {
                border-color: color-mix(in oklab, var(--text) 18%, var(--grid));
                background: color-mix(in oklab, var(--text) 10%, transparent);
            }

            @media (max-width:380px) {
                .fields {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>

    <body>
        <div class="app">
            <header>
                <div class="headline">
                    <div class="title" id="headlineTitle">Prochaines règles</div>
                    <div class="sub" id="headlineSub">Définir le cycle via Paramètres</div>
                    <div class="legend" aria-hidden="true">
                        <span><span class="dot period"></span>Règles</span>
                        <span><span class="dot fertile"></span>Fertile</span>
                        <span><span class="dot ovu"></span>Ovulation</span>
                        <span><span class="dot today"></span>Aujourd'hui</span>
                    </div>
                </div>
                <div class="actions">
                    <button class="iconBtn" id="btnInstall" title="Ajouter à l'écran d'accueil"
                        aria-label="Ajouter à l'écran d'accueil" style="display:none;">＋</button>
                    <button class="iconBtn" id="btnSettings" title="Paramètres" aria-label="Paramètres">⚙</button>
                </div>
            </header>

            <section class="calendarShell">
                <div class="monthRow">
                    <button class="iconBtn" id="btnPrev" title="Mois précédent" aria-label="Mois précédent">‹</button>
                    <div class="monthTitle" id="monthTitle">—</div>
                    <button class="iconBtn" id="btnNext" title="Mois suivant" aria-label="Mois suivant">›</button>
                </div>

                <div class="dow" aria-hidden="true">
                    <div>Lun</div>
                    <div>Mar</div>
                    <div>Mer</div>
                    <div>Jeu</div>
                    <div>Ven</div>
                    <div>Sam</div>
                    <div>Dim</div>
                </div>

                <div class="swiper" id="swiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <div class="calGrid" id="gridPrev"></div>
                        </div>
                        <div class="swiper-slide">
                            <div class="calGrid" id="gridCur"></div>
                        </div>
                        <div class="swiper-slide">
                            <div class="calGrid" id="gridNext"></div>
                        </div>
                    </div>
                </div>

                <div class="hint" id="hint">Glisser horizontalement ou utiliser ‹ › pour changer de mois.</div>
            </section>
        </div>

        <dialog id="dlg">
            <form method="dialog" class="modal" id="settingsForm">
                <h2>Paramètres</h2>

                <div class="fields">
                    <div class="field">
                        <label for="lastStart">Début dernières règles</label>
                        <input id="lastStart" name="lastStart" type="date" required />
                    </div>

                    <div class="field">
                        <label for="cycleLen">Longueur cycle (jours)</label>
                        <input id="cycleLen" name="cycleLen" type="number" min="15" max="60" step="1" required />
                    </div>

                    <div class="field">
                        <label for="periodLen">Durée règles (jours)</label>
                        <input id="periodLen" name="periodLen" type="number" min="1" max="15" step="1" required />
                    </div>

                    <div class="field">
                        <label for="lutealLen">Phase lutéale (jours)</label>
                        <input id="lutealLen" name="lutealLen" type="number" min="8" max="20" step="1" required />
                    </div>
                </div>

                <div class="modalActions">
                    <button value="cancel">Annuler</button>
                    <button type="button" class="danger" id="btnReset">Réinitialiser</button>
                    <button class="primary" id="btnSave" value="default">Enregistrer</button>
                </div>
            </form>
        </dialog>

        <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
        <script>
            const LS_KEY = "cycleTracker.v1";

            const DEFAULTS = {
                lastStartISO: "",
                cycleLen: 28,
                periodLen: 5,
                lutealLen: 14
            };

            const $ = (id) => document.getElementById(id);

            const state = {
                anchorMonth: startOfMonth(new Date()),
                settings: loadSettings(),
                deferredInstallPrompt: null,
                swiper: null,
                committing: false
            };

            function loadSettings() {
                try {
                    const raw = localStorage.getItem(LS_KEY);
                    if (!raw) return { ...DEFAULTS };
                    const parsed = JSON.parse(raw);
                    return {
                        lastStartISO: typeof parsed.lastStartISO === "string" ? parsed.lastStartISO : DEFAULTS.lastStartISO,
                        cycleLen: clampInt(parsed.cycleLen, 15, 60, DEFAULTS.cycleLen),
                        periodLen: clampInt(parsed.periodLen, 1, 15, DEFAULTS.periodLen),
                        lutealLen: clampInt(parsed.lutealLen, 8, 20, DEFAULTS.lutealLen)
                    };
                } catch {
                    return { ...DEFAULTS };
                }
            }

            function saveSettings(next) {
                state.settings = { ...next };
                localStorage.setItem(LS_KEY, JSON.stringify(state.settings));
                updateHeadline();
                renderAll();
            }

            function resetSettings() {
                localStorage.removeItem(LS_KEY);
                state.settings = { ...DEFAULTS };
                updateHeadline();
                renderAll();
                if (state.swiper) state.swiper.slideTo(1, 0, false);
            }

            function clampInt(v, min, max, fallback) {
                const n = Number(v);
                if (!Number.isFinite(n)) return fallback;
                const i = Math.trunc(n);
                if (i < min || i > max) return fallback;
                return i;
            }

            function isoDate(d) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, "0");
                const day = String(d.getDate()).padStart(2, "0");
                return `${y}-${m}-${day}`;
            }

            function parseISO(iso) {
                const [y, m, d] = iso.split("-").map((x) => Number(x));
                if (!y || !m || !d) return null;
                const dt = new Date(y, m - 1, d);
                if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
                return dt;
            }

            function addDays(d, n) {
                const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                dt.setDate(dt.getDate() + n);
                return dt;
            }

            function startOfMonth(d) {
                return new Date(d.getFullYear(), d.getMonth(), 1);
            }

            function startOfDay(d) {
                return new Date(d.getFullYear(), d.getMonth(), d.getDate());
            }

            function daysBetween(a, b) {
                const aa = startOfDay(a);
                const bb = startOfDay(b);
                return Math.round((bb - aa) / (24 * 3600 * 1000));
            }

            function monthLabel(d) {
                const fmt = new Intl.DateTimeFormat("fr-FR", { month: "long", year: "numeric" });
                const s = fmt.format(d);
                return s.charAt(0).toUpperCase() + s.slice(1);
            }

            function dayIndexMondayFirst(d) {
                const js = d.getDay();
                return (js + 6) % 7;
            }

            function gridStartDate(monthStart) {
                const idx = dayIndexMondayFirst(monthStart);
                return addDays(monthStart, -idx);
            }

            function computeWindowsForRange(rangeStart, rangeEndInclusive) {
                const s = state.settings;
                const lastStart = parseISO(s.lastStartISO);
                if (!lastStart) return { periodSet: new Set(), fertileSet: new Set(), ovuSet: new Set() };

                const cycleLen = s.cycleLen;
                const periodLen = s.periodLen;

                const periodSet = new Set();
                const fertileSet = new Set();
                const ovuSet = new Set();

                const rs = startOfDay(rangeStart);
                const re = startOfDay(rangeEndInclusive);

                const diff = Math.floor((rs - lastStart) / (24 * 3600 * 1000));
                const k0 = Math.floor(diff / cycleLen) - 2;

                for (let k = k0; k < k0 + 30; k++) {
                    const cycleStart = addDays(lastStart, k * cycleLen);
                    const cycleEnd = addDays(cycleStart, cycleLen - 1);
                    if (cycleEnd < addDays(rs, -20)) continue;
                    if (cycleStart > addDays(re, 20)) break;

                    for (let i = 0; i < periodLen; i++) {
                        const d = addDays(cycleStart, i);
                        if (d >= rs && d <= re) periodSet.add(isoDate(d));
                    }

                    const ovuDay = addDays(cycleStart, 14);
                    if (ovuDay >= rs && ovuDay <= re) ovuSet.add(isoDate(ovuDay));

                    const fStart = addDays(ovuDay, -5);
                    const fEnd = addDays(ovuDay, 1);
                    for (let i = 0; i <= daysBetween(fStart, fEnd); i++) {
                        const d = addDays(fStart, i);
                        if (d >= rs && d <= re) fertileSet.add(isoDate(d));
                    }
                }

                return { periodSet, fertileSet, ovuSet };
            }

            function nextPeriodStartFrom(today) {
                const s = state.settings;
                const lastStart = parseISO(s.lastStartISO);
                if (!lastStart) return null;

                const t0 = startOfDay(today);
                const diff = Math.floor((t0 - lastStart) / (24 * 3600 * 1000));
                const k = Math.floor(diff / s.cycleLen);
                let candidate = addDays(lastStart, k * s.cycleLen);
                if (candidate <= t0) candidate = addDays(candidate, s.cycleLen);
                return candidate;
            }

            function currentCycleStartFor(today) {
                const s = state.settings;
                const lastStart = parseISO(s.lastStartISO);
                if (!lastStart) return null;

                const t0 = startOfDay(today);
                const diff = Math.floor((t0 - lastStart) / (24 * 3600 * 1000));
                const k = Math.floor(diff / s.cycleLen);
                return addDays(lastStart, k * s.cycleLen);
            }

            function isPeriodDay(dateISO) {
                const dt = parseISO(dateISO);
                if (!dt) return false;
                const s = state.settings;
                const lastStart = parseISO(s.lastStartISO);
                if (!lastStart) return false;

                const diff = Math.floor((dt - lastStart) / (24 * 3600 * 1000));
                const k = Math.floor(diff / s.cycleLen);
                const cycleStart = addDays(lastStart, k * s.cycleLen);
                const dayInCycle = daysBetween(cycleStart, dt);
                return dayInCycle >= 0 && dayInCycle < s.periodLen;
            }

            function formatShortDate(d) {
                const fmt = new Intl.DateTimeFormat("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" });
                return fmt.format(d);
            }

            function updateHeadline() {
                const title = $("headlineTitle");
                const sub = $("headlineSub");

                const s = state.settings;
                const lastStart = parseISO(s.lastStartISO);
                if (!lastStart) {
                    title.textContent = "Prochaines règles";
                    sub.textContent = "Définir le cycle via Paramètres";
                    return;
                }

                const today = new Date();
                const todayISO = isoDate(today);

                if (isPeriodDay(todayISO)) {
                    const cycleStart = currentCycleStartFor(today);
                    const dayIndex = daysBetween(cycleStart, startOfDay(today)) + 1;
                    title.textContent = "Règles en cours";
                    sub.textContent = `Jour ${dayIndex}/${s.periodLen}`;
                    return;
                }

                const nextStart = nextPeriodStartFrom(today);
                const d = daysBetween(startOfDay(today), nextStart);
                title.textContent = `Prochaines règles dans ${d} jour${d === 1 ? "" : "s"}`;
                sub.textContent = `Dernier début: ${formatShortDate(lastStart)} • Cycle: ${s.cycleLen}j • Règles: ${s.periodLen}j`;
            }

            function renderAll() {
                const cur = state.anchorMonth;
                const prev = startOfMonth(new Date(cur.getFullYear(), cur.getMonth() - 1, 1));
                const next = startOfMonth(new Date(cur.getFullYear(), cur.getMonth() + 1, 1));

                $("monthTitle").textContent = monthLabel(cur);

                renderMonthGrid($("gridPrev"), prev);
                renderMonthGrid($("gridCur"), cur);
                renderMonthGrid($("gridNext"), next);

                if (state.swiper) state.swiper.update();
            }

            function renderMonthGrid(container, monthStart) {
                container.innerHTML = "";

                const start = gridStartDate(monthStart);
                const totalDays = 42;
                const end = addDays(start, totalDays - 1);

                const { periodSet, fertileSet, ovuSet } = computeWindowsForRange(start, end);

                const today = startOfDay(new Date());
                const todayISO = isoDate(today);

                for (let i = 0; i < totalDays; i++) {
                    const d = addDays(start, i);
                    const dISO = isoDate(d);
                    const inMonth = d.getMonth() === monthStart.getMonth();

                    const cell = document.createElement("div");
                    cell.className = "cell";
                    if (!inMonth) cell.classList.add("outMonth");

                    if (dISO === todayISO) cell.classList.add("today");
                    else if (d > today) cell.classList.add("future");

                    const isPeriod = periodSet.has(dISO);
                    const isOvu = ovuSet.has(dISO);
                    const isFertile = fertileSet.has(dISO);

                    if (isOvu) cell.classList.add("ovuBg");
                    else if (isPeriod) cell.classList.add("periodBg");
                    else if (isFertile) cell.classList.add("fertileBg");

                    const dayNum = document.createElement("div");
                    dayNum.className = "dayNum";
                    dayNum.textContent = String(d.getDate());

                    const badges = document.createElement("div");
                    badges.className = "badges";

                    if (isOvu) {
                        const b = document.createElement("span");
                        b.className = "badge ovu";
                        badges.appendChild(b);
                    } else if (isPeriod) {
                        const b = document.createElement("span");
                        b.className = "badge period";
                        badges.appendChild(b);
                    } else if (isFertile) {
                        const b = document.createElement("span");
                        b.className = "badge fertile";
                        badges.appendChild(b);
                    }

                    cell.appendChild(dayNum);
                    cell.appendChild(badges);
                    container.appendChild(cell);
                }
            }

            function shiftMonth(delta) {
                const cur = state.anchorMonth;
                state.anchorMonth = startOfMonth(new Date(cur.getFullYear(), cur.getMonth() + delta, 1));
            }

            function commitAfterSwipe(activeIndex) {
                if (state.committing) return;
                if (activeIndex === 1) return;

                state.committing = true;

                if (activeIndex === 0) shiftMonth(-1);
                else if (activeIndex === 2) shiftMonth(1);

                renderAll();

                // Recenter instantly to middle slide after DOM update
                state.swiper.allowTouchMove = false;
                state.swiper.slideTo(1, 0, false);
                state.swiper.allowTouchMove = true;

                state.committing = false;
            }

            function setupSwiper() {
                state.swiper = new Swiper("#swiper", {
                    initialSlide: 1,
                    speed: 260,
                    resistanceRatio: 0.85,
                    threshold: 5,
                    longSwipes: true,
                    longSwipesRatio: 0.2,
                    longSwipesMs: 0,
                    shortSwipes: true,
                    followFinger: true,
                    loop: false,
                    allowTouchMove: true,
                    on: {
                        slideChangeTransitionEnd(sw) {
                            commitAfterSwipe(sw.activeIndex);
                        }
                    }
                });
            }

            function setupMonthButtons() {
                $("btnPrev").addEventListener("click", () => state.swiper.slidePrev());
                $("btnNext").addEventListener("click", () => state.swiper.slideNext());
            }

            function syncSettingsDialog() {
                const s = state.settings;
                $("lastStart").value = s.lastStartISO || "";
                $("cycleLen").value = String(s.cycleLen);
                $("periodLen").value = String(s.periodLen);
                $("lutealLen").value = String(s.lutealLen);
            }

            function setupDialog() {
                const dlg = $("dlg");

                $("btnSettings").addEventListener("click", () => {
                    syncSettingsDialog();
                    dlg.showModal();
                });

                $("btnSave").addEventListener("click", (e) => {
                    e.preventDefault();
                    const lastStartISO = $("lastStart").value;
                    const lastStart = parseISO(lastStartISO);
                    if (!lastStart) return;

                    const next = {
                        lastStartISO,
                        cycleLen: clampInt($("cycleLen").value, 15, 60, DEFAULTS.cycleLen),
                        periodLen: clampInt($("periodLen").value, 1, 15, DEFAULTS.periodLen),
                        lutealLen: clampInt($("lutealLen").value, 8, 20, DEFAULTS.lutealLen)
                    };

                    saveSettings(next);
                    dlg.close();
                });

                $("btnReset").addEventListener("click", (e) => {
                    e.preventDefault();
                    resetSettings();
                    syncSettingsDialog();
                    dlg.close();
                });
            }

            function setupInstallButton() {
                const btn = $("btnInstall");
                const hint = $("hint");

                window.addEventListener("beforeinstallprompt", (e) => {
                    e.preventDefault();
                    state.deferredInstallPrompt = e;
                    btn.style.display = "grid";
                });

                window.addEventListener("appinstalled", () => {
                    state.deferredInstallPrompt = null;
                    btn.style.display = "none";
                });

                btn.addEventListener("click", async () => {
                    const p = state.deferredInstallPrompt;
                    if (!p) {
                        hint.textContent = "Menu du navigateur → \"Ajouter à l'écran d'accueil\".";
                        window.setTimeout(() => {
                            hint.textContent = "Glisser horizontalement ou utiliser ‹ › pour changer de mois.";
                        }, 3500);
                        return;
                    }

                    btn.style.display = "none";
                    await p.prompt();
                    try {
                        await p.userChoice;
                    } finally {
                        state.deferredInstallPrompt = null;
                    }
                });
            }

            function setupManifestDataUri() {
                const manifest = {
                    name: "Clair de lune",
                    short_name: "ClairLune",
                    start_url: "./",
                    display: "standalone",
                    background_color: "#0f0f10",
                    theme_color: "#111111",
                    icons: [
                        { src: "./icon.svg", sizes: "any", type: "image/svg+xml", purpose: "any" },
                        { src: "./icon-192.png", sizes: "192x192", type: "image/png", purpose: "any" },
                        { src: "./icon-512.png", sizes: "512x512", type: "image/png", purpose: "any" }
                    ]
                };

                const json = JSON.stringify(manifest);
                const href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(json);

                const link = document.createElement("link");
                link.rel = "manifest";
                link.href = href;
                document.head.appendChild(link);
            }

            function init() {
                setupManifestDataUri();
                setupDialog();
                setupInstallButton();

                updateHeadline();
                renderAll();

                setupSwiper();
                setupMonthButtons();

                requestAnimationFrame(() => state.swiper.slideTo(1, 0, false));
                window.addEventListener("resize", () => state.swiper.slideTo(1, 0, false));
            }

            init();
        </script>
    </body>

</html>
